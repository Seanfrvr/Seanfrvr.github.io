name: Rename mascot to Ink

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-mascot-ink.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace mascot name only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "This is only the beginning of Felix appearing throughout Sean's case files."
          new = "This is only the beginning of Ink appearing throughout Sean's case files."

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one mascot-name match, found {count}. No file written.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify only the intended text changed
        shell: bash
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit rename and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rename-mascot-ink.yml
          git add index.html .github/workflows/rename-mascot-ink.yml
          git diff --cached --check
          git commit -m "Rename mascot to Ink"
          git push
